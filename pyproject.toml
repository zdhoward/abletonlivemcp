[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abletonlivemcp"
version = "0.0.1"
description = "MCP server that lets LLMs assist in Ableton Live: racks, macros, organization, and chain building."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zach Howard" }]
keywords = ["ableton", "ableton-live", "mcp", "llm", "music-production"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["mcp>=2,<3"]

[project.scripts]
abletonlivemcp = "abletonlivemcp.server:main"
abletonlivemcp-install = "abletonlivemcp.install:main"

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
dev = ["pytest>=8", "ruff>=0.6", "typesafe-sdk>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/abletonlivemcp"]
exclude =["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.wheel.force-include]
"remote_script/AbletonLiveMCP" = "abletonlivemcp/_remote_script/AbletonLiveMCP"

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/LICENSE", "/src", "/remote_script/AbletonLiveMCP", "/tests"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "remote_script"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
