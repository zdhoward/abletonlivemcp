[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zx-ableton-live-mcp"
dynamic = ["version"]
description = "Model Context Protocol (MCP) server for Ableton Live: let AI assistants like Claude read and edit your Live Set."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zach Howard" }]
keywords = ["ableton", "ableton-live", "ableton-live-12", "mcp", "model-context-protocol", "claude", "ai-assistant", "music-production", "midi", "daw"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/zdhoward/abletonlivemcp"
Repository = "https://github.com/zdhoward/abletonlivemcp"
Issues = "https://github.com/zdhoward/abletonlivemcp/issues"
Changelog = "https://github.com/zdhoward/abletonlivemcp/blob/main/CHANGELOG.md"

[project.scripts]
abletonlivemcp = "abletonlivemcp.server:main"
abletonlivemcp-install = "abletonlivemcp.install:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# One version source, shared with the Remote Script (live_hello compares the two).
[tool.hatch.version]
path = "remote_script/AbletonLiveMCP/version.py"

[tool.hatch.build.targets.wheel]
# The Remote Script ships inside the package through a path mapping, not force-include: hatch
# applies `exclude` to mapped sources but never to force-included ones. Developer probes
# (remote_script/AbletonLiveMCP/probe_pNN.py) stay in the source tree only.
only-include = ["src/abletonlivemcp", "remote_script/AbletonLiveMCP"]
dev-mode-dirs = ["src"]  # editable installs: hatch cannot map prefix-changing sources
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo", "**/probe_p[0-9][0-9].py"]

[tool.hatch.build.targets.wheel.sources]
"src/abletonlivemcp" = "abletonlivemcp"
"remote_script/AbletonLiveMCP" = "abletonlivemcp/_remote_script/AbletonLiveMCP"

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "abletonlivemcp/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE", "/src", "/remote_script/AbletonLiveMCP"]
exclude = ["/.gitignore", "**/__pycache__", "**/*.pyc", "**/*.pyo", "**/probe_p[0-9][0-9].py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # test the source tree, never a stale non-editable install

[tool.ruff]
line-length = 100
src = ["src", "tests", "remote_script"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
