name: Publish

# A version tag builds, checks and uploads the release to PyPI through trusted publishing
# (no stored token). PyPI trusts this file name and the `pypi` environment only.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - run: python scripts/check_distribution.py dist --smoke
      - name: Tag matches the package version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'VERSION = \"([^\"]+)\"', pathlib.Path('remote_script/AbletonLiveMCP/version.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zx-ableton-live-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
